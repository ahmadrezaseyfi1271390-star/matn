<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>مبارزه سه‌بعدی</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; background: #0a0a1a; touch-action: none; }
  canvas { display: block; }

  #hud { position: fixed; top: 15px; left: 15px; right: 15px; pointer-events: none; z-index: 10; }
  #health-bar { width: 220px; height: 22px; background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
  #health-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff2222, #ffaa00, #22ff22); transition: width 0.2s; }
  #score, #enemies { color: #fff; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 4px #000; margin-bottom: 4px; }

  #joystick-zone { position: fixed; bottom: 30px; left: 30px; width: 160px; height: 160px; z-index: 20; touch-action: none; }
  #joystick-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.12); border: 3px solid rgba(255,255,255,0.4); position: relative; backdrop-filter: blur(4px); }
  #joystick-stick { width: 65px; height: 65px; border-radius: 50%; background: rgba(255,255,255,0.7); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(0,200,255,0.6); }

  #punch-btn { position: fixed; bottom: 45px; right: 35px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #ff4444, #aa0000); border: 4px solid #fff; color: #fff; font-size: 44px; z-index: 20; touch-action: none; box-shadow: 0 0 30px rgba(255,50,50,0.7); cursor: pointer; transition: transform 0.05s; }
  #punch-btn:active { transform: scale(0.9); }

  #loading { position: fixed; inset: 0; background: #0a0a1a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 100; flex-direction: column; gap: 20px; }
  .spinner { width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.2); border-top-color: #00ccff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #game-over { position: fixed; inset: 0; background: rgba(0,0,0,0.85); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 20px; }
  #game-over h1 { font-size: 48px; color: #ff4444; text-shadow: 0 0 20px #ff0000; }
  #game-over p { font-size: 24px; }
  #restart-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background: #00ccff; border: none; border-radius: 12px; color: #fff; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="hud">
  <div id="health-bar"><div id="health-fill"></div></div>
  <div id="score">امتیاز: <span id="score-val">0</span></div>
  <div id="enemies">دشمنان: <span id="enemy-val">0</span></div>
</div>

<div id="joystick-zone"><div id="joystick-base"><div id="joystick-stick"></div></div></div>
<button id="punch-btn">👊</button>

<div id="loading"><div class="spinner"></div>در حال بارگذاری R07_rigged.glb ...</div>

<div id="game-over" class="hidden">
  <h1>بازی تمام شد!</h1>
  <p>امتیاز نهایی: <span id="final-score">0</span></p>
  <button id="restart-btn">شروع مجدد</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============ صحنه ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 30, 80);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444466, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(15, 25, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x2a2a4a, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(200, 100, 0x4444aa, 0x222255);
grid.position.y = 0.01;
scene.add(grid);

// ============ متغیرها ============
let player = null;
let playerMixer = null;
let actions = {};
let currentAction = null;
const enemies = [];

const state = {
  health: 100, maxHealth: 100, score: 0,
  gameOver: false, punchCooldown: 0,
  spawnTimer: 1, spawnInterval: 3, playing: false,
};

const clock = new THREE.Clock();
const keys = { w:false, a:false, s:false, d:false };
const joy = { x:0, y:0, active:false };

// ============ بارگذاری کاراکتر (R بزرگ) ============
const MODEL_URL = 'R07_rigged.glb';
const loader = new GLTFLoader();
loader.load(MODEL_URL, (gltf) => {
  player = gltf.scene;
  player.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(player);

  if (gltf.animations?.length) {
    playerMixer = new THREE.AnimationMixer(player);
    gltf.animations.forEach(clip => {
      actions[clip.name.toLowerCase()] = playerMixer.clipAction(clip);
    });
    console.log('🎬 انیمیشن‌های موجود:', Object.keys(actions));
    playAction('idle');
  } else {
    console.warn('⚠️ این مدل انیمیشن ندارد!');
  }

  camera.position.set(0, 5, 9);
  document.getElementById('loading').classList.add('hidden');
  state.playing = true;
}, undefined, (err) => {
  console.error('❌ خطا:', err);
  document.getElementById('loading').innerHTML =
    `<div style="color:#f66;text-align:center;padding:20px">
      خطا در بارگذاری <b>R07_rigged.glb</b><br>
      <small style="opacity:.7">مطمئن شو فایل کنار HTML هست و روی سرور اجرا می‌کنی</small>
    </div>`;
});

// ============ انیمیشن ============
function playAction(name, fade = 0.2) {
  if (!playerMixer) return;
  const key = Object.keys(actions).find(k => k.includes(name));
  if (!key) return;
  const next = actions[key];
  if (currentAction === next) return;
  next.reset().fadeIn(fade).play();
  if (currentAction) currentAction.fadeOut(fade);
  currentAction = next;
}

// ============ کیبورد ============
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='w'||k==='arrowup') keys.w = true;
  if (k==='s'||k==='arrowdown') keys.s = true;
  if (k==='a'||k==='arrowleft') keys.a = true;
  if (k==='d'||k==='arrowright') keys.d = true;
  if (k===' ') { e.preventDefault(); doPunch(); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k==='w'||k==='arrowup') keys.w = false;
  if (k==='s'||k==='arrowdown') keys.s = false;
  if (k==='a'||k==='arrowleft') keys.a = false;
  if (k==='d'||k==='arrowright') keys.d = false;
});

// ============ جوی‌استیک ============
const joyZone = document.getElementById('joystick-zone');
const joyStick = document.getElementById('joystick-stick');
let joyTouchId = null;
const joyMax = 50;

function joyStart(e) {
  e.preventDefault();
  const t = e.changedTouches ? e.changedTouches[0] : e;
  joyTouchId = t.identifier ?? 'mouse';
  joy.active = true;
  joyMove(e);
}
function joyMove(e) {
  if (!joy.active) return;
  e.preventDefault();
  const t = e.changedTouches
    ? Array.from(e.changedTouches).find(tt => tt.identifier === joyTouchId)
    : e;
  if (!t) return;
  const r = joyZone.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > joyMax) { dx = dx/dist*joyMax; dy = dy/dist*joyMax; }
  joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joy.x = dx / joyMax;
  joy.y = dy / joyMax;
}
function joyEnd(e) {
  e.preventDefault();
  joy.active = false; joyTouchId = null;
  joy.x = 0; joy.y = 0;
  joyStick.style.transform = 'translate(-50%, -50%)';
}
joyZone.addEventListener('touchstart', joyStart, { passive:false });
joyZone.addEventListener('touchmove', joyMove, { passive:false });
joyZone.addEventListener('touchend', joyEnd, { passive:false });
joyZone.addEventListener('touchcancel', joyEnd, { passive:false });
joyZone.addEventListener('mousedown', joyStart);
addEventListener('mousemove', e => { if (joy.active) joyMove(e); });
addEventListener('mouseup', e => { if (joy.active) joyEnd(e); });

// ============ دکمه مشت ============
const punchBtn = document.getElementById('punch-btn');
punchBtn.addEventListener('touchstart', e => { e.preventDefault(); doPunch(); }, { passive:false });
punchBtn.addEventListener('mousedown', e => { e.preventDefault(); doPunch(); });

function doPunch() {
  if (!player || state.gameOver || state.punchCooldown > 0) return;
  state.punchCooldown = 0.5;
  playAction('punch', 0.1);
  setTimeout(() => playAction('idle', 0.3), 400);

  const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion);
  const punchPoint = player.position.clone().add(forward.multiplyScalar(2.5));
  punchPoint.y += 1;

  createPunchEffect(punchPoint);

  enemies.slice().forEach(enemy => {
    if (enemy.position.distanceTo(punchPoint) < 2.5) damageEnemy(enemy);
  });
}

function createPunchEffect(pos) {
  const geo = new THREE.SphereGeometry(0.3, 16, 16);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9 });
  const fx = new THREE.Mesh(geo, mat);
  fx.position.copy(pos);
  scene.add(fx);
  const start = performance.now();
  const anim = () => {
    const t = (performance.now() - start) / 300;
    if (t >= 1) { scene.remove(fx); fx.geometry.dispose(); fx.material.dispose(); return; }
    fx.scale.setScalar(1 + t*3);
    fx.material.opacity = 0.9 * (1 - t);
    requestAnimationFrame(anim);
  };
  anim();
}

// ============ دشمنان ============
function createEnemy() {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.6 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1, 4, 8), bodyMat);
  body.position.y = 1.2; body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.45, 16, 16),
    new THREE.MeshStandardMaterial({ color: 0xff6666 })
  );
  head.position.y = 2.4; head.castShadow = true;
  group.add(head);

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  [-0.18, 0.18].forEach(x => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
    eye.position.set(x, 2.5, 0.38);
    group.add(eye);
  });

  const armMat = new THREE.MeshStandardMaterial({ color: 0xcc2222 });
  [-0.65, 0.65].forEach(x => {
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.8, 4, 8), armMat);
    arm.position.set(x, 1.3, 0); arm.castShadow = true;
    group.add(arm);
  });

  const angle = Math.random() * Math.PI * 2;
  const dist = 20 + Math.random() * 10;
  group.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);

  group.userData = { hp:30, speed:2+Math.random()*1.5, attackCooldown:0, hitFlash:0, bodyMat };
  scene.add(group);
  enemies.push(group);
}

function damageEnemy(enemy) {
  enemy.userData.hp -= 15;
  enemy.userData.hitFlash = 0.3;
  const dir = enemy.position.clone().sub(player.position).normalize();
  enemy.position.add(dir.multiplyScalar(1.5));

  if (enemy.userData.hp <= 0) {
    scene.remove(enemy);
    const i = enemies.indexOf(enemy);
    if (i >= 0) enemies.splice(i, 1);
    state.score += 10;
    document.getElementById('score-val').textContent = state.score;
  }
}

// ============ حرکت بازیکن ============
const playerSpeed = 6;
const moveDir = new THREE.Vector3();
let targetRotation = 0;

function updatePlayer(dt) {
  if (!player || state.gameOver) return;

  let ix = 0, iz = 0;
  if (keys.w) iz -= 1;
  if (keys.s) iz += 1;
  if (keys.a) ix -= 1;
  if (keys.d) ix += 1;
  ix += joy.x; iz += joy.y;

  const len = Math.hypot(ix, iz);
  const moving = len > 0.15;

  if (moving) {
    ix /= len; iz /= len;
    moveDir.set(ix, 0, iz).normalize();
    player.position.addScaledVector(moveDir, playerSpeed * dt);
    targetRotation = Math.atan2(moveDir.x, moveDir.z);

    if (currentAction !== actions['punch']) playAction('run', 0.2);
  } else {
    if (state.punchCooldown <= 0 && currentAction !== actions['idle']) playAction('idle', 0.3);
  }

  const diff = ((targetRotation - player.rotation.y + Math.PI) % (Math.PI*2)) - Math.PI;
  player.rotation.y += diff * Math.min(1, dt * 12);

  const lim = 45;
  player.position.x = Math.max(-lim, Math.min(lim, player.position.x));
  player.position.z = Math.max(-lim, Math.min(lim, player.position.z));
}

// ============ دوربین ============
const camDesired = new THREE.Vector3();
const camTarget = new THREE.Vector3();

function updateCamera(dt) {
  if (!player) return;
  const backDir = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
  camDesired.copy(player.position)
    .add(backDir.multiplyScalar(-8))
    .add(new THREE.Vector3(0, 5, 0));
  camera.position.lerp(camDesired, Math.min(1, dt * 4));
  camTarget.copy(player.position).add(new THREE.Vector3(0, 1.8, 0));
  camera.lookAt(camTarget);
}

// ============ دشمنان AI ============
function updateEnemies(dt) {
  if (!player) return;

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0 && enemies.length < 8) {
    state.spawnTimer = state.spawnInterval;
    createEnemy();
  }

  enemies.forEach(enemy => {
    const ud = enemy.userData;
    ud.attackCooldown -= dt;
    ud.hitFlash -= dt;

    if (ud.hitFlash > 0) {
      ud.bodyMat.emissive.setHex(0xffffff);
      ud.bodyMat.emissiveIntensity = ud.hitFlash * 3;
    } else {
      ud.bodyMat.emissive.setHex(0x000000);
    }

    const dir = player.position.clone().sub(enemy.position);
    dir.y = 0;
    const dist = dir.length();

    if (dist > 1.8) {
      dir.normalize();
      enemy.position.addScaledVector(dir, ud.speed * dt);
      enemy.rotation.y = Math.atan2(dir.x, dir.z);
    } else if (ud.attackCooldown <= 0 && !state.gameOver) {
      ud.attackCooldown = 1.2;
      state.health -= 10;
      updateHealthUI();
      enemy.position.y = 0.3;
      setTimeout(() => enemy.position.y = 0, 150);
      if (state.health <= 0) gameOver();
    }

    const lim = 50;
    enemy.position.x = Math.max(-lim, Math.min(lim, enemy.position.x));
    enemy.position.z = Math.max(-lim, Math.min(lim, enemy.position.z));
  });

  document.getElementById('enemy-val').textContent = enemies.length;
}

function updateHealthUI() {
  const pct = Math.max(0, state.health) / state.maxHealth * 100;
  document.getElementById('health-fill').style.width = pct + '%';
}

// ============ پایان بازی ============
function gameOver() {
  state.gameOver = true;
  document.getElementById('final-score').textContent = state.score;
  document.getElementById('game-over').classList.remove('hidden');
}

document.getElementById('restart-btn').addEventListener('click', () => {
  enemies.forEach(e => scene.remove(e));
  enemies.length = 0;
  Object.assign(state, {
    health: state.maxHealth, score: 0, gameOver: false,
    spawnTimer: 1, punchCooldown: 0,
  });
  if (player) { player.position.set(0,0,0); player.rotation.set(0,0,0); }
  updateHealthUI();
  document.getElementById('score-val').textContent = '0';
  document.getElementById('game-over').classList.add('hidden');
});

// ============ حلقه اصلی ============
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (state.playing) {
    if (state.punchCooldown > 0) state.punchCooldown -= dt;
    updatePlayer(dt);
    updateEnemies(dt);
    updateCamera(dt);
    if (playerMixer) playerMixer.update(dt);
  }

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

updateHealthUI();
animate();
</script>
</body>
</html>
